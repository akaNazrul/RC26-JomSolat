<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- icon logo for JomSolat for multiple devices supported -->
    <link rel="icon" type="image/png" href="public/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg" href="public/favicon.svg" />
    <link rel="shortcut icon" href="public/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="public/apple-touch-icon.png" />
    <link rel="mask-icon" href="public/web-app-manifest-512x512.png" color="#1A1A2E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="JomSolat - Prayer times, events, and everything about Masjid Al-Malik Khalid, USM — in one place." />
    <meta name="theme-color" content="#1A1A2E" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="JomSolat" />
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Preconnect to Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Poppins:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" />
    
    <!-- Prevent theme flicker - must be in head before React loads -->
    <script>
      (function() {
        try {
          var savedTheme = localStorage.getItem('jomsolat-storage');
          if (savedTheme) {
            var parsed = JSON.parse(savedTheme);
            if (parsed.state && parsed.state.theme) {
              document.documentElement.classList.remove('dark', 'light');
              document.documentElement.classList.add(parsed.state.theme);
            }
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    
    <title>JomSolat - Masjid Al-Malik Khalid</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
